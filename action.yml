name: 'DeskUptime Check'
description: >
  Uptime + SSL + content-change checks for one or more URLs.
  Fails the job if any URL is unhealthy (HTTP 4xx/5xx or network error),
  with JSON output and optional GitHub Step Summary report.
branding:
  icon: 'activity'
  color: 'green'

inputs:
  urls:
    description: 'Space- or newline-separated list of URLs to check'
    required: true
  fail-on-down:
    description: 'Fail the workflow step if any URL is unhealthy (HTTP 4xx/5xx or network error)'
    required: false
    default: 'true'
  fail-on-ssl-expiry-days:
    description: 'Also fail if a HTTPS URL has an SSL certificate expiring within N days (0 = disabled)'
    required: false
    default: '0'
  summary:
    description: 'Write a Markdown status table to $GITHUB_STEP_SUMMARY'
    required: false
    default: 'true'

outputs:
  json:
    description: 'Raw check results as a JSON array'
    value: ${{ steps.check.outputs.json }}
  down-count:
    description: 'Number of unhealthy URLs (HTTP 4xx/5xx or network error)'
    value: ${{ steps.check.outputs.down }}

runs:
  using: 'composite'
  steps:
    - id: check
      shell: bash
      env:
        DU_URLS: ${{ inputs.urls }}
        DU_FAIL_ON_DOWN: ${{ inputs.fail-on-down }}
        DU_SSL_DAYS: ${{ inputs.fail-on-ssl-expiry-days }}
        DU_SUMMARY: ${{ inputs.summary }}
        DU_TIMEOUT: '15000'
      run: |
        set -euo pipefail

        # Resolve the CLI entry inside this action's own directory
        ACTION_PATH="$(cd "${GITHUB_ACTION_PATH:-.}" && pwd)"
        CLI="$ACTION_PATH/src/cli.js"
        # The summary table and the client report share one cell escaper, and
        # the `node -e` blocks below are CommonJS, so they reach it by path.
        export DU_ACTION_PATH="$ACTION_PATH"

        if [ ! -f "$CLI" ]; then
          echo "::error::deskuptime cli.js not found at $CLI"
          exit 1
        fi

        node -e 'if (Number(process.versions.node.split(".")[0]) < 24) { console.error("::error::Node.js 24+ is required"); process.exit(1); }'

        # Normalize input to a space-separated URL list
        read -r -a URL_LIST <<< "$(printf '%s' "$DU_URLS" | tr '\n' ' ')"
        export DU_EXPECTED_URLS=${#URL_LIST[@]}
        echo "Checking URLs: ${URL_LIST[*]}"

        # Run check in --json mode; capture exit code without failing early
        set +e
        OUT=$(node "$CLI" check "${URL_LIST[@]}" --json --timeout "$DU_TIMEOUT")
        CODE=$?
        set -e

        if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then
          echo "::error::DeskUptime check failed with exit code $CODE"
          exit "$CODE"
        fi

        echo "$OUT"
        printf '%s' "$OUT" > deskuptime-results.json

        # Verify the payload before counting it. An empty array, a missing
        # `healthy` field or fewer results than requested URLs would otherwise
        # count as down=0 and turn a broken check into a green run.
        node -e '
          const fs = require("fs");
          const raw = fs.readFileSync("deskuptime-results.json", "utf8");
          const fail = (msg) => { console.error("::error::" + msg); process.exit(1); };
          let r;
          try { r = JSON.parse(raw); } catch (e) { fail("deskuptime did not return valid JSON: " + e.message); }
          const expected = Number(process.env.DU_EXPECTED_URLS);
          if (!Number.isInteger(expected) || expected < 1) fail("internal error: expected URL count is unknown");
          if (!Array.isArray(r)) fail("deskuptime returned " + typeof r + ", expected a JSON array");
          if (r.length === 0) fail("deskuptime returned no results for " + expected + " URL(s)");
          if (r.length !== expected) fail("deskuptime returned " + r.length + " result(s) for " + expected + " URL(s)");
          for (const x of r) {
            if (typeof x.url !== "string" || x.url === "") fail("result without a url field");
            if (typeof x.healthy !== "boolean") fail("result for " + x.url + " has no boolean healthy field");
            // Present-but-not-a-boolean is the shape a different CLI version
            // sends. It was unchecked, so a payload the SSL counter below reads
            // passed validation and then counted on a value that was not a fact.
            if (x.sslExpiringSoon !== undefined && typeof x.sslExpiringSoon !== "boolean") {
              fail("result for " + x.url + " has a non-boolean sslExpiringSoon field");
            }
          }
        '

        # Parse results with node (no jq dependency on runner)
        DOWN_COUNT=$(node -e '
          const r = JSON.parse(require("fs").readFileSync("deskuptime-results.json","utf8"));
          console.log(r.filter(x => !x.healthy).length);
        ')
        SSL_FAIL_COUNT=$(node -e '
          const { readSslState } = require(process.env.DU_ACTION_PATH + "/src/status.js");
          const days = parseInt(process.env.DU_SSL_DAYS || "0", 10);
          const r = JSON.parse(require("fs").readFileSync("deskuptime-results.json","utf8"));
          let n = 0;
          for (const x of r) {
            // A lapsed certificate is its own fact. `sslDaysRemaining` is clamped
            // to 0, so it cannot express "expired 3 months ago" — reading the
            // window alone made an expired site look like one expiring tonight.
            if (days > 0 && x.sslExpired === true) n++;
            // `<=`, not `<`: the CLI, `watch` and the client report all warn at
            // exactly `days` remaining, so a certificate on the boundary used to
            // pass here and fail everywhere else. The window itself is this
            // action'"'"'s own input, but whether the value is a day count at all
            // is not: readSslState() is the one answer, so this counter and the
            // summary cell below cannot disagree about an unusable value.
            else if (days > 0 && readSslState({ days: x.sslDaysRemaining }).days !== null && x.sslDaysRemaining <= days) n++;
            else if (days > 0 && x.healthy && x.url.startsWith("https") && x.sslError) n++;
          }
          console.log(n);
        ')

        echo "down=$DOWN_COUNT" >> "$GITHUB_OUTPUT"
        echo "json<<EOF_JSON" >> "$GITHUB_OUTPUT"
        echo "$OUT" >> "$GITHUB_OUTPUT"
        echo "EOF_JSON" >> "$GITHUB_OUTPUT"

        # Step summary table
        if [ "$DU_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## 🖥️ DeskUptime report"
            echo ""
            echo "| URL | Status | HTTP | Response | SSL days |"
            echo "|-----|--------|------|----------|----------|"
            node -e '
              const { formatMs, markdownCell } = require(process.env.DU_ACTION_PATH + "/src/display.js");
              const { expiredNote, readSslState } = require(process.env.DU_ACTION_PATH + "/src/status.js");
              const r = JSON.parse(require("fs").readFileSync("deskuptime-results.json","utf8"));
              for (const x of r) {
                const s = x.healthy ? "✅ UP" : "❌ DOWN";
                // The day count and the duration are read through the owners the
                // CLI, both status lists and the client report already use. This
                // block used to judge on its own whether a number was usable, so
                // a corrupt `sslDaysRemaining` printed as -2 and a negative
                // response time as -5ms in the one table a customer reads in
                // their CI run — where every other surface says —.
                const ssl = readSslState({ days: x.sslDaysRemaining, expired: x.sslExpired, expiredDays: x.sslExpiredDays });
                const sslCell = ssl.expired
                  ? `🔴 ${expiredNote(ssl.expiredDays)}`
                  : ssl.days === null ? "—" : String(ssl.days);
                // Every cell goes through markdownCell. A summary is the one
                // human surface that reached neither safeText nor the client
                // report'"'"'s own cell(), and one `|` or one newline in a URL
                // was enough to write a forged row — including one claiming a
                // site was DOWN while every real check was UP.
                console.log(`| ${markdownCell(x.url)} | ${markdownCell(s)} | ${markdownCell(x.statusCode ?? "—")} | ${markdownCell(formatMs(x.responseTimeMs))} | ${markdownCell(sslCell)} |`);
              }
            '
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        # Exit policy
        if [ "$DOWN_COUNT" -gt 0 ] && [ "$DU_FAIL_ON_DOWN" = "true" ]; then
          echo "::error::$DOWN_COUNT URL(s) are unhealthy"
          exit 2
        fi
        if [ "$SSL_FAIL_COUNT" -gt 0 ]; then
          echo "::error::$SSL_FAIL_COUNT URL(s) have SSL certificates expiring within $DU_SSL_DAYS days or invalid"
          exit 3
        fi
        exit 0
