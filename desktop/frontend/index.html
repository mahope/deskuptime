<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskUptime</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>
  <main id="mainContent" class="app-shell">
    <header class="app-header">
      <div>
        <h1 class="app-title">DeskUptime</h1>
        <p class="app-subtitle">Desktop website monitor</p>
      </div>
      <div class="header-actions">
        <button id="btnCheckAll" class="button button-secondary" type="button">Check all</button>
        <button id="btnAddUrl" class="button" type="button">Add URL</button>
      </div>
    </header>

    <section class="monitor-bar" aria-label="Background monitor status">
      <div class="monitor-state">
        <span class="monitor-dot" aria-hidden="true"></span>
        <span>Background monitoring active</span>
        <span id="monitorBadge" class="monitor-badge" hidden></span>
      </div>
      <label class="interval-control">
        <span>Check every</span>
        <select id="intervalSelect" class="select">
          <option value="60">1 min</option>
          <option value="300" selected>5 min</option>
          <option value="600">10 min</option>
          <option value="1800">30 min</option>
        </select>
      </label>
    </section>

    <p id="appMessage" class="app-message" role="status" aria-live="polite"></p>

    <section id="addForm" class="panel add-form" aria-labelledby="urlLabel" hidden>
      <label id="urlLabel" class="field-label" for="urlInput">Website URL</label>
      <div class="add-controls">
        <input
          id="urlInput"
          class="text-input"
          type="url"
          name="url"
          inputmode="url"
          autocomplete="url"
          spellcheck="false"
          placeholder="example.com"
        >
        <button id="btnAddConfirm" class="button" type="button">Add</button>
        <button id="btnAddCancel" class="button button-secondary" type="button">Cancel</button>
      </div>
    </section>

    <section id="urlList" class="url-list" aria-label="Monitored URLs" aria-live="polite">
      <div class="empty-state">
        <p class="empty-title">No URLs monitored yet</p>
        <p class="empty-hint">Add a URL to start monitoring.</p>
      </div>
    </section>

    <p class="app-footer">All checks run locally on your machine.</p>

    <section class="panel license-section" aria-labelledby="licenseTitle">
      <div id="licenseFree" class="panel-row">
        <div>
          <p id="licenseTitle" class="license-title">DeskUptime Free</p>
          <p class="license-copy">Monitor up to 3 URLs. Upgrade for unlimited monitoring.</p>
        </div>
        <div class="license-actions">
          <a class="button button-pro" href="https://buy.stripe.com/7sY9AS9eX3Iu418fJ5bMQ01" target="_blank" rel="noopener noreferrer">Buy Pro — $19</a>
          <button id="btnShowLicense" class="button" type="button">Activate license</button>
        </div>
      </div>

      <div id="licenseForm" class="license-form" hidden>
        <label for="licenseInput">License key from your purchase email</label>
        <div class="add-controls">
          <input
            id="licenseInput"
            class="text-input"
            type="text"
            name="license"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="32-character license key"
          >
          <button id="btnActivate" class="button" type="button">Activate</button>
          <button id="btnCancelLicense" class="button button-secondary" type="button">Cancel</button>
        </div>
        <p id="licenseError" class="license-error" role="alert" hidden></p>
      </div>

      <div id="licenseActive" class="panel-row" hidden>
        <div>
          <p class="license-active-title">Pro activated</p>
          <p id="licenseVerified" class="license-verified"></p>
        </div>
        <button id="btnDeactivate" class="button button-danger" type="button">Deactivate</button>
      </div>
    </section>
  </main>
</body>
</html>
