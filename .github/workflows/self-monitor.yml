name: Self-monitor
# Dogfooding: DeskUptime watches every Mahope product site.
# A failing run means a site is down or its certificate expires within 14 days;
# GitHub e-mails the repo owner on the first failure and on recovery.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check all product sites
        id: du
        uses: ./
        with:
          fail-on-ssl-expiry-days: '14'
          urls: |
            https://deskuptime.com/
            https://deskuptime.com/da/
            https://eucomplypro.com/
            https://eucomplypro.com/scan/
            https://cleancopy.tools/
            https://transmute.run/
            https://bugbottle.dev/
            https://mahope.tools/
            https://mahope.tools/api/health
            https://eucomply-scan.mahope-eeb.workers.dev/stats
            https://deskuptime-quickcheck.mahope-eeb.workers.dev/check?url=https://mahoje.dk
            https://github.com/mahope/deskuptime
      - name: Report
        run: echo "down-count = ${{ steps.du.outputs.down-count }}"
