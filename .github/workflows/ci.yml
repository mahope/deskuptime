name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit
      - name: Smoke — JSON mode parses with jq
        run: node src/cli.js check https://example.com --json | jq -e '.[0].healthy == true'

  # The device_id scheme must be identical on native Windows, where os.hostname()
  # returns the 15-char NetBIOS name while the desktop app reads COMPUTERNAME.
  license-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test test/license.test.js
