name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Derive version
        run: echo "APP_VERSION=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_ENV"

      - name: Build with Tauri CLI
        working-directory: desktop
        shell: bash
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri build ${{ matrix.args }}

      - name: Collect bundles (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$DIR" -name '*.app' -maxdepth 3 -exec zip -r "DeskUptime-macOS-${{ matrix.target }}.zip" {} \;
          cp "$DIR"/dmg/*.dmg . 2>/dev/null || true

      - name: Collect bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object { Copy-Item $_ . }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskUptime-${{ matrix.target }}
          path: |
            DeskUptime-*
            *.exe
            *.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
