name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        run: cargo build --release ${{ matrix.args }}

      - name: Package macOS app (arm64)
        if: matrix.os == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
        run: |
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/DeskUptime-${{ github.ref_name }}-macOS-arm64.zip" DeskUptime.app

      - name: Package macOS app (intel)
        if: matrix.os == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        run: |
          cd desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/DeskUptime-${{ github.ref_name }}-macOS-intel.zip" DeskUptime.app

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/src-tauri/target/release/bundle/nsis/*.exe -DestinationPath DeskUptime-${{ github.ref_name }}-Windows-x64-setup.zip
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse -Include *.msi | ForEach-Object { Copy-Item $_ DeskUptime-${{ github.ref_name }}-Windows-x64.msi }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskUptime-${{ matrix.target }}
          path: |
            DeskUptime-*.zip
            DeskUptime-*.msi
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
